name: Dependency Vulnerability Scan

# Reports advisories in the job log without failing the build.
#
# Two constraints shape this file:
#  1. SARIF upload to Security -> Code scanning needs GitHub Advanced Security,
#     which is not purchased for this private repo (the API returns 422). So the
#     upstream reusable workflow cannot be used here.
#  2. The lockfile carries transitive dev-only advisories we cannot patch
#     directly (image-size via vinext, esbuild via drizzle-kit), so failing on
#     findings would make red the permanent steady state and train us to ignore
#     it.
#
# Dependabot alerts (Security -> Dependabot) are the actionable channel; this
# scan is a second opinion and will also cover Gradle if a lockfile is ever
# added there.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies with OSV
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --recursive
            ./
