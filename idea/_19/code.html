                أدخل الرمز المكون من 4 أرقام المرسل إلى <br/>
<span class="font-bold text-on-surface" dir="ltr">+249 912 xxx xxxx</span>
</p>
<form class="flex flex-col gap-lg">
<div class="flex justify-center gap-sm md:gap-md" dir="ltr">
<input autofocus="" class="w-14 h-16 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary-container focus:outline-none transition-all" maxlength="1" type="text"/>
<input class="w-14 h-16 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary-container focus:outline-none transition-all" maxlength="1" type="text"/>
<input class="w-14 h-16 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary-container focus:outline-none transition-all" maxlength="1" type="text"/>
<input class="w-14 h-16 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-2 focus:ring-primary-container focus:outline-none transition-all" maxlength="1" type="text"/>
</div>

                        إعادة الإرسال (<span id="timer">01:30</span>)
                    </button>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full shadow-[0_2px_4px_rgba(13,124,132,0.2)] hover:bg-surface-tint hover:shadow-[0_4px_8px_rgba(13,124,132,0.3)] transition-all active:scale-[0.98]" type="submit">
                    التحقق وتسجيل الدخول
                </button>
</form>

</main>
<script>
        const inputs = document.querySelectorAll('input[type="text"]');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 0 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
