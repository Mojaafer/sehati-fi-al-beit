<body class="bg-background text-on-background font-body-lg antialiased min-h-screen flex flex-col">
<!-- Header -->

<h1 class="text-headline-md font-headline-md text-on-surface">طريقة الدفع</h1>
<div class="flex-1 flex justify-end">
<button aria-label="الرجوع" class="p-2 -mr-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_forward</span>
</button>
</div>
</header>
<main class="flex-1 px-margin-mobile py-md flex flex-col gap-lg pb-32">
<!-- Order Summary Card -->
<section class="bg-surface-container-lowest rounded-xl p-4 shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-container-highest">
<div class="flex justify-between items-center">
<div class="flex items-center gap-4">

</div>
<div>

</div>
</div>
<div class="text-left whitespace-nowrap">
<span class="text-body-md font-bold text-on-surface">15,000 ج.س</span>
</div>
</div>
</section>
<!-- Payment Options -->
<section>
<div class="mb-md">
<h2 class="text-headline-md font-headline-md text-on-surface mb-2">اختر طريقة الدفع</h2>
<p class="text-body-md font-body-md text-on-surface-variant">اختر الوسيلة الأنسب لك لإتمام عملية الدفع بشكل آمن وسريع</p>
</div>
<div class="flex flex-col gap-sm" id="payment-options">
<!-- Option 1: Bank Card -->
<label class="relative flex items-center p-4 bg-surface-container-lowest border-2 border-primary rounded-xl cursor-pointer transition-all hover:bg-surface-container-low">
<input checked="" class="peer sr-only" name="payment_method" type="radio" value="card"/>
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center ml-4 shrink-0 peer-checked:border-primary">
<div class="w-3 h-3 rounded-full bg-primary opacity-100 transition-opacity"></div>
</div>
<div class="flex-1 flex justify-between items-center">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="text-body-md font-bold text-on-surface">بطاقة بنكية</span>
<span class="text-label-sm font-label-sm text-secondary bg-secondary-fixed-dim/20 px-2 py-0.5 rounded-full">موصى بها</span>
</div>
<p class="text-label-sm font-label-sm text-on-surface-variant">ادفع باستخدام بطاقتك البنكية فيزا أو ماستركارد</p>
</div>
<div class="w-12 h-12 rounded-lg bg-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-primary">credit_card</span>
</div>
</div>
</label>

<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center ml-4 shrink-0 peer-checked:border-primary">
<div class="w-3 h-3 rounded-full bg-primary opacity-0 transition-opacity peer-checked:opacity-100"></div>
</div>
<div class="flex-1 flex justify-between items-center">
<div>
<div class="text-body-md font-bold text-on-surface mb-1">فوري</div>

</div>

            متابعة للدفع
        </button>
</div>
<script>
        // Simple logic to handle radio button visual state changes
        document.addEventListener('DOMContentLoaded', () => {
            const labels = document.querySelectorAll('#payment-options label');
            const radios = document.querySelectorAll('#payment-options input[type="radio"]');

            function updateStyles() {
                radios.forEach((radio, index) => {
                    const label = labels[index];
                    const innerCircle = label.querySelector('.w-3.h-3');
                    const outerCircle = label.querySelector('.w-6.h-6');
                    
                    if (radio.checked) {
                        label.classList.add('border-2', 'border-primary');
                        label.classList.remove('border', 'border-surface-container-highest');
                        outerCircle.classList.add('border-primary');
                        outerCircle.classList.remove('border-outline-variant');
                        innerCircle.classList.add('opacity-100');
                        innerCircle.classList.remove('opacity-0');
                    } else {
                        label.classList.remove('border-2', 'border-primary');
                        label.classList.add('border', 'border-surface-container-highest');
                        outerCircle.classList.remove('border-primary');
                        outerCircle.classList.add('border-outline-variant');
                        innerCircle.classList.remove('opacity-100');
                        innerCircle.classList.add('opacity-0');
                    }
                });
            }

            radios.forEach(radio => {
                radio.addEventListener('change', updateStyles);
            });
        });
    </script>
