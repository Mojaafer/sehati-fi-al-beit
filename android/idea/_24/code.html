<style>
        body { font-family: 'Public Sans', sans-serif; }
        h1, h2, h3, .brand-font { font-family: 'Manrope', sans-serif; }
        .star-rating .material-symbols-outlined { font-variation-settings: 'FILL' 0; cursor: pointer; transition: color 0.2s; }
        .star-rating .material-symbols-outlined.active { font-variation-settings: 'FILL' 1; color: #a16034; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface shadow-sm w-full top-0 sticky z-40">
<div class="flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 w-full">
<button class="text-on-surface-variant hover:bg-surface-variant p-2 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined">close</span>
</button>
<div class="font-headline-md text-headline-md text-primary font-bold">
                تقييم الخدمة
            </div>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop pb-24">
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-[0_4px_16px_rgba(13,124,132,0.08)] p-8 md:p-12 border border-surface-variant">
<!-- Header Section -->
<div class="text-center mb-10">
<div class="w-20 h-20 bg-secondary-container rounded-full flex items-center justify-center mx-auto mb-6">
<span class="material-symbols-outlined text-4xl text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">شكراً لثقتكم بنا</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">كيف كانت تجربتك مع جلسة العلاج الطبيعي اليوم؟ رأيك يهمنا لتحسين خدماتنا.</p>
</div>
<!-- Star Rating Widget -->
<div class="flex flex-col items-center mb-10">
<p class="font-label-md text-label-md text-on-surface-variant mb-4">التقييم العام</p>
<div class="flex gap-2 star-rating" dir="ltr">
<span class="material-symbols-outlined text-4xl text-outline-variant hover:text-tertiary-container" data-value="1">star</span>
<span class="material-symbols-outlined text-4xl text-outline-variant hover:text-tertiary-container" data-value="2">star</span>
<span class="material-symbols-outlined text-4xl text-outline-variant hover:text-tertiary-container" data-value="3">star</span>
<span class="material-symbols-outlined text-4xl text-outline-variant hover:text-tertiary-container" data-value="4">star</span>
<span class="material-symbols-outlined text-4xl text-outline-variant hover:text-tertiary-container" data-value="5">star</span>
</div>
</div>
<!-- Specific Praise Toggles -->
<div class="mb-10">
<p class="font-label-md text-label-md text-on-surface-variant mb-4">ما الذي أعجبك بشكل خاص؟</p>
<div class="flex flex-wrap gap-3">
<label class="cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-body-md text-body-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-all">
                            الالتزام بالوقت
                        </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-body-md text-body-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-all">
                            الاحترافية
                        </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-body-md text-body-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-all">
                            النظافة والتعقيم
                        </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-body-md text-body-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-all">
                            الرعاية والاهتمام
                        </div>
</label>
</div>
</div>
<!-- Written Feedback -->
<div class="mb-10">
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="feedback">ملاحظات إضافية (اختياري)</label>
<textarea class="w-full rounded-lg border border-outline-variant bg-surface p-4 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-none" id="feedback" placeholder="شاركنا تفاصيل تجربتك..." rows="4"></textarea>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-label-md text-label-md font-bold hover:bg-on-primary-fixed-variant transition-colors shadow-[0_2px_4px_rgba(0,97,104,0.2)] active:scale-[0.98]">
                إرسال التقييم
            </button>
</div>
</main>
<script>
        const stars = document.querySelectorAll('.star-rating .material-symbols-outlined');
        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                stars.forEach((s, i) => {
                    if (i <= index) {
                        s.classList.add('active');
                        s.classList.remove('text-outline-variant');
                    } else {
                        s.classList.remove('active');
                        s.classList.add('text-outline-variant');
                    }
                });
            });
        });
    </script>
